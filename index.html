<style>
/* Layout: single-column phone app, two roles (student / guard), tab bar for the guard */
:root {
  --bg: #F3F5F2; --surface: #FFFFFF; --fg: #141A16; --muted: #5C665F; --line: #D5DCD4;
  --accent: #17733F; --accent-soft: #DCEFE2; --ok: #17733F; --bad: #B3261E; --bad-soft: #F8DEDA;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1411; --surface: #18201B; --fg: #E8EEE9; --muted: #9AA69E; --line: #2C3730;
  --accent: #4CC27E; --accent-soft: #1D3527; --ok: #4CC27E; --bad: #F2867D; --bad-soft: #3A1E1B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F1411; --surface: #18201B; --fg: #E8EEE9; --muted: #9AA69E; --line: #2C3730;
  --accent: #4CC27E; --accent-soft: #1D3527; --ok: #4CC27E; --bad: #F2867D; --bad-soft: #3A1E1B; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 16px; line-height: 1.45 }
.app { max-width: 480px; margin: 0 auto; padding-block: 16px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 16px }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px }
.brand { font-weight: 700; font-size: 20px; letter-spacing: -0.3px }
.brand small { font-family: var(--mono); font-size: 12px; color: var(--muted); font-weight: 500; margin-left: 6px }
.link { background: none; border: 0; color: var(--accent); font: inherit; font-weight: 600; cursor: pointer; padding: 6px 0 }
h1 { font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance }
h2 { font-size: 18px; margin: 0 }
p { margin: 0 }
.muted { color: var(--muted) }
.label { font-family: var(--mono); font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted) }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px }
.stack { display: flex; flex-direction: column; gap: 10px }
.row { display: flex; align-items: center; gap: 12px; min-width: 0 }
.row > .grow { flex: 1; min-width: 0 }
.card.row { flex-direction: row; padding: 12px }
.card.row .btn { padding: 10px 12px; font-size: 14px }
button.btn { font: inherit; font-weight: 600; border-radius: 12px; padding: 14px 16px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer; text-align: center }
button.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface) }
button.btn.danger { color: var(--bad); border-color: var(--bad) }
button.btn:focus-visible, .link:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
button.btn:disabled { opacity: .5 }
input[type=text], input[type=search] { font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg) }
.role { display: grid; gap: 12px }
.role button { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; padding: 18px }
.role button span { font-weight: 400; color: var(--muted) }
.avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: none; background: var(--accent-soft) }
.avatar.lg { width: 168px; height: 168px }
.pill { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap }
.pill.ok { background: var(--accent-soft); color: var(--ok) }
.pill.bad { background: var(--bad-soft); color: var(--bad) }
/* student credential */
.cred { align-items: center; text-align: center }
.qrbox { background: #FFFFFF; padding: 14px; border-radius: 12px; line-height: 0 }
.qrbox canvas { width: 240px; height: 240px; image-rendering: pixelated }
.bar { width: 100%; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--accent); transition: width 1s linear }
.code { font-family: var(--mono); font-size: 26px; font-weight: 600; letter-spacing: 6px; font-variant-numeric: tabular-nums }
/* scanner */
.scan { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 1 / 1; max-width: 100% }
.scan video { width: 100%; height: 100%; object-fit: cover; display: block }
.scan .frame { position: absolute; inset: 18%; border: 3px solid rgba(255,255,255,.85); border-radius: 16px }
.verdict { border-radius: 16px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center }
.verdict.ok { background: var(--accent-soft); border: 2px solid var(--ok) }
.verdict.bad { background: var(--bad-soft); border: 2px solid var(--bad) }
.verdict .big { font-size: 28px; font-weight: 700 }
.verdict.ok .big { color: var(--ok) } .verdict.bad .big { color: var(--bad) }
.verdict .name { font-size: 22px; font-weight: 600 }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  display: grid; grid-template-columns: repeat(4, 1fr);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
nav.tabs button { background: none; border: 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--muted); padding: 10px 4px; border-radius: 10px; cursor: pointer }
nav.tabs button[aria-current="page"] { color: var(--accent); background: var(--accent-soft) }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap }
th { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted) }
.note { font-size: 14px; color: var(--muted) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 20 }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none } }
</style>

<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="toast" id="toast" hidden></div>
<input type="file" id="filePick" accept="image/*" hidden>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const APP_VERSION = 'v1';
const STEP = 30;       // seconds per code
const DIGITS = 6;
const WINDOW = 1;      // accepted clock drift, in steps

// ---------- storage (falls back to memory when blocked) ----------
const mem = {};
const store = {
  get(k, d) { try { const v = localStorage.getItem('ps_' + k); return v == null ? (k in mem ? mem[k] : d) : JSON.parse(v) } catch { return k in mem ? mem[k] : d } },
  set(k, v) { mem[k] = v; try { localStorage.setItem('ps_' + k, JSON.stringify(v)) } catch {} },
};

// ---------- demo data (fictional students, same on every device) ----------
const DEMO = [
  { id: 'D01', name: 'Camila Rojas',    active: true,  secret: 'KRSXG5CTMVRXEZLUMFZG2YLJNQ2DAMBT', color: '#2F6F8F' },
  { id: 'D02', name: 'Matías Fuentes',  active: true,  secret: 'MZXW6YTBOI2DCMBSGQZDGNBVGY3TQOJQ', color: '#8F5A2F' },
  { id: 'D03', name: 'Valentina Soto',  active: true,  secret: 'NBSWY3DPEB3W64TMMQ2DQNZXGEYTGMRR', color: '#6B3F8F' },
  { id: 'D04', name: 'Benjamín Muñoz',  active: false, secret: 'ORSXG5BAMNXWIZJAGEZDGNBVGYZTANBS', color: '#3F7A4A' },
];
function initials(n) { return n.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase() }
function demoAvatar(s) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="${s.color}"/><circle cx="50" cy="40" r="18" fill="rgba(255,255,255,.35)"/><path d="M16 100c4-24 18-32 34-32s30 8 34 32z" fill="rgba(255,255,255,.35)"/><text x="50" y="47" text-anchor="middle" font-family="Arial" font-weight="700" font-size="20" fill="#fff">${initials(s.name)}</text></svg>`;
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function allStudents() {
  const overrides = store.get('active', {});
  const enrolled = store.get('enrolled', []);
  return [...DEMO.map(s => ({ ...s, photo: demoAvatar(s), demo: true })), ...enrolled]
    .map(s => ({ ...s, active: s.id in overrides ? overrides[s.id] : s.active }));
}
const findStudent = id => allStudents().find(s => s.id === id);

// ---------- TOTP (RFC 6238, HMAC-SHA1) ----------
function base32Decode(str) {
  const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567'; let bits = '', out = [];
  for (const c of str.replace(/=+$/, '').toUpperCase()) { const v = alpha.indexOf(c); if (v < 0) continue; bits += v.toString(2).padStart(5, '0') }
  for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(out);
}
function randomSecret() {
  const alpha = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567', b = crypto.getRandomValues(new Uint8Array(20));
  return Array.from(b, x => alpha[x % 32]).join('');
}
const keyCache = {};
async function hotp(secret, counter) {
  if (!keyCache[secret]) keyCache[secret] = crypto.subtle.importKey('raw', base32Decode(secret), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const buf = new ArrayBuffer(8), view = new DataView(buf);
  view.setUint32(0, Math.floor(counter / 2 ** 32)); view.setUint32(4, counter >>> 0);
  const sig = new Uint8Array(await crypto.subtle.sign('HMAC', await keyCache[secret], buf));
  const off = sig[19] & 15;
  const bin = ((sig[off] & 0x7f) << 24) | (sig[off + 1] << 16) | (sig[off + 2] << 8) | sig[off + 3];
  return String(bin % 10 ** DIGITS).padStart(DIGITS, '0');
}
const nowStep = () => Math.floor(Date.now() / 1000 / STEP);

// payload: PS1|<studentId>|<step>|<code>
async function verifyPayload(text) {
  const parts = String(text).trim().split('|');
  if (parts[0] !== 'PS1' || parts.length !== 4) return { ok: false, reason: 'No es una credencial PasoSeguro' };
  const [, id, stepStr, code] = parts, step = Number(stepStr), s = findStudent(id);
  if (!s) return { ok: false, reason: 'Estudiante no registrado' };
  if (Math.abs(step - nowStep()) > WINDOW) return { ok: false, student: s, reason: 'Código vencido (posible pantallazo)' };
  if (code !== await hotp(s.secret, step)) return { ok: false, student: s, reason: 'Código inválido' };
  const used = store.get('used', {}), key = id + ':' + step;
  if (used[key]) return { ok: false, student: s, reason: 'Código ya usado (posible pantallazo)' };
  if (!s.active) return { ok: false, student: s, reason: 'Credencial no vigente' };
  used[key] = Date.now();
  // keep only recent entries
  for (const k in used) if (Date.now() - used[k] > 5 * 60 * 1000) delete used[k];
  store.set('used', used);
  return { ok: true, student: s };
}

// ---------- helpers ----------
const $app = document.getElementById('app'), $tabs = document.getElementById('tabs');
function h(html) { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])) }
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200) }
function drawQR(canvas, text) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), scale = 8, size = n * scale;
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, size, size); ctx.fillStyle = '#000';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) ctx.fillRect(c * scale, r * scale, scale, scale);
}
function logEvent(e) { const log = store.get('log', []); log.push({ t: new Date().toISOString(), v: APP_VERSION, ...e }); store.set('log', log) }
let cleanup = [];
function teardown() { cleanup.forEach(f => { try { f() } catch {} }); cleanup = [] }

// decode a QR from a photo (works without live camera access)
function pickImage(capture) {
  return new Promise(res => {
    const inp = document.getElementById('filePick');
    inp.value = ''; capture ? inp.setAttribute('capture', capture) : inp.removeAttribute('capture');
    inp.onchange = () => res(inp.files[0] || null); inp.click();
  });
}
function loadImage(file) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = rej; img.src = URL.createObjectURL(file) });
}
async function decodeFile(file) {
  const img = await loadImage(file), c = document.createElement('canvas');
  const k = Math.min(1, 1200 / Math.max(img.width, img.height));
  c.width = img.width * k; c.height = img.height * k;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height);
  return jsQR(d.data, d.width, d.height)?.data || null;
}
// live scanner; returns stop() or null when the camera is unavailable
async function startLiveScan(container, onText) {
  if (!navigator.mediaDevices?.getUserMedia) return null;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }) } catch { return null }
  const video = document.createElement('video'); video.playsInline = true; video.muted = true; video.srcObject = stream;
  container.innerHTML = ''; container.append(video, h('<div class="frame"></div>'));
  await video.play().catch(() => {});
  const c = document.createElement('canvas'), ctx = c.getContext('2d', { willReadFrequently: true });
  let alive = true, paused = false, last = 0;
  (function tick(ts) {
    if (!alive) return;
    if (!paused && video.readyState >= 2 && ts - last > 120) {
      last = ts; const w = 480, hgt = Math.round(480 * video.videoHeight / video.videoWidth) || 480;
      c.width = w; c.height = hgt; ctx.drawImage(video, 0, 0, w, hgt);
      const r = jsQR(ctx.getImageData(0, 0, w, hgt).data, w, hgt, { inversionAttempts: 'dontInvert' });
      if (r?.data) { paused = true; onText(r.data) }
    }
    requestAnimationFrame(tick);
  })(0);
  return { stop() { alive = false; stream.getTracks().forEach(t => t.stop()) }, resume() { paused = false } };
}
async function saveCsv(filename, text) {
  try {
    const dl = await window.claude?.use?.('downloads');
    if (dl) { await dl.save({ filename, data: new Blob([text], { type: 'text/csv' }) }); return }
  } catch (e) { if (e?.code) { toast('Descarga cancelada'); return } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = filename; a.click();
}

// ---------- views ----------
function topBar(back) {
  return `<header class="top"><div class="brand">PasoSeguro<small>${APP_VERSION}</small></div>${back ? '<button class="link" data-go="">Cambiar rol</button>' : ''}</header>`;
}
function bindGo(root) { root.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go)) }

function viewHome() {
  $tabs.hidden = true;
  $app.replaceChildren(h(`${topBar(false)}
    <div class="stack"><h1>Prototipo de validación de credenciales</h1>
    <p class="muted">INACAP sede Chillán. Abre este enlace en dos celulares: uno como estudiante y otro como guardia.</p></div>
    <div class="role">
      <button class="btn" data-go="estudiante">Soy estudiante<span>Muestra tu credencial con QR dinámico</span></button>
      <button class="btn" data-go="guardia">Soy guardia<span>Escanea y valida el ingreso</span></button>
    </div>
    <p class="note">Prototipo académico. Los estudiantes de ejemplo son ficticios.</p>`));
  bindGo($app);
}

// ----- student -----
function viewStudentPick() {
  $tabs.hidden = true;
  const linked = store.get('myCreds', []);
  const list = [...DEMO.map(s => ({ id: s.id, name: s.name, secret: s.secret })), ...linked];
  const frag = h(`${topBar(true)}
    <div class="stack"><h1>Elige tu credencial</h1><p class="muted">Usa un estudiante de ejemplo o vincula la credencial que te creó el guardia.</p></div>
    <div class="card" id="list"></div>
    <button class="btn" id="link">Vincular credencial nueva</button>`);
  const box = frag.getElementById('list');
  list.forEach(s => {
    const st = findStudent(s.id);
    const row = h(`<button class="btn row" style="text-align:left"><img class="avatar" alt="" src="${st ? st.photo || '' : demoAvatar({ name: s.name, color: '#17733F' })}"><span class="grow">${esc(s.name)}</span></button>`).firstChild;
    row.onclick = () => { store.set('me', s); go('estudiante') };
    box.append(row);
  });
  frag.getElementById('link').onclick = () => viewStudentLink();
  $app.replaceChildren(frag); bindGo($app);
}
async function viewStudentLink() {
  teardown();
  const frag = h(`${topBar(true)}
    <div class="stack"><h1>Vincular credencial</h1><p class="muted">Escanea el QR de vinculación que aparece en el celular del guardia.</p></div>
    <div class="scan" id="cam"><p class="muted" style="color:#fff;padding:16px">Abriendo cámara…</p></div>
    <button class="btn" id="photo">Tomar foto del QR</button>
    <button class="link" id="cancel">Volver</button>`);
  $app.replaceChildren(frag); bindGo($app);
  const handle = async text => {
    const p = String(text).split('|');
    if (p[0] !== 'PSPAIR' || p.length !== 4) { toast('Ese QR no es de vinculación'); live?.resume(); return }
    const cred = { id: p[1], name: p[2], secret: p[3] };
    const mine = store.get('myCreds', []).filter(c => c.id !== cred.id); mine.push(cred); store.set('myCreds', mine);
    store.set('me', cred); teardown(); go('estudiante');
  };
  document.getElementById('cancel').onclick = () => { teardown(); store.set('me', null); go('estudiante') };
  document.getElementById('photo').onclick = async () => {
    const f = await pickImage('environment'); if (!f) return;
    const t = await decodeFile(f); t ? handle(t) : toast('No se encontró un QR en la foto');
  };
  const cam = document.getElementById('cam');
  const live = await startLiveScan(cam, handle);
  if (live) cleanup.push(() => live.stop()); else cam.replaceChildren(h('<p style="color:#fff;padding:16px">La cámara en vivo no está disponible aquí. Usa “Tomar foto del QR”.</p>'));
}
function viewStudentCred(me) {
  teardown(); $tabs.hidden = true;
  const st = findStudent(me.id);
  const frag = h(`${topBar(true)}
    <div class="card cred">
      <div class="row" style="justify-content:center"><img class="avatar" alt="" src="${st?.photo || ''}" ${st?.photo ? '' : 'hidden'}><div style="text-align:left"><div class="label">Credencial virtual</div><h2>${esc(me.name)}</h2></div></div>
      <div class="qrbox"><canvas id="qr" aria-label="Código QR dinámico"></canvas></div>
      <div class="bar"><i id="bar"></i></div>
      <p><span class="muted">Cambia en</span> <b id="left">0:30</b></p>
      <div><div class="label">Código manual</div><div class="code" id="code">------</div></div>
    </div>
    <p class="note">El código se genera en este celular y cambia cada ${STEP} segundos. Un pantallazo deja de servir apenas cambia.</p>
    <button class="link" id="other">Usar otra credencial</button>`);
  $app.replaceChildren(frag); bindGo($app);
  document.getElementById('other').onclick = () => { store.set('me', null); go('estudiante') };
  let shown = -1;
  async function tick() {
    const step = nowStep(), left = STEP - Math.floor(Date.now() / 1000) % STEP;
    document.getElementById('left').textContent = '0:' + String(left).padStart(2, '0');
    document.getElementById('bar').style.width = (left / STEP * 100) + '%';
    if (step !== shown) {
      shown = step; const code = await hotp(me.secret, step);
      drawQR(document.getElementById('qr'), `PS1|${me.id}|${step}|${code}`);
      document.getElementById('code').textContent = code.slice(0, 3) + ' ' + code.slice(3);
    }
  }
  tick(); const iv = setInterval(tick, 1000); cleanup.push(() => clearInterval(iv));
  // keep the screen on while showing the credential
  navigator.wakeLock?.request('screen').then(l => cleanup.push(() => l.release())).catch(() => {});
}

// ----- guard -----
const GUARD_TABS = [['escanear', 'Escanear'], ['nombre', 'Por nombre'], ['estudiantes', 'Estudiantes'], ['registro', 'Registro']];
function guardShell(tab) {
  teardown(); $tabs.hidden = false;
  $tabs.replaceChildren(...GUARD_TABS.map(([k, label]) => {
    const b = document.createElement('button'); b.textContent = label; if (k === tab) b.setAttribute('aria-current', 'page');
    b.onclick = () => go('guardia', k); return b;
  }));
}
function verdictHtml(r, mode) {
  const s = r.student;
  return r.ok
    ? `<div class="verdict ok" role="status"><div class="big">✓ Ingreso permitido</div><img class="avatar lg" alt="Foto del estudiante" src="${s.photo}"><div class="name">${esc(s.name)}</div><span class="pill ok">VIGENTE</span><p class="muted">Compara la foto con la persona antes de dejarla pasar.</p></div>`
    : `<div class="verdict bad" role="alert"><div class="big">✕ Ingreso rechazado</div>${s ? `<img class="avatar lg" alt="" src="${s.photo}"><div class="name">${esc(s.name)}</div>` : ''}<p><b>${esc(r.reason)}</b></p><p class="muted">Pide que muestre la credencial en vivo o búscalo por nombre.</p></div>`;
}
async function viewGuardScan() {
  guardShell('escanear');
  const frag = h(`${topBar(true)}
    <div class="stack"><h1>Validar ingreso</h1><p class="muted">Apunta la cámara al QR de la credencial.</p></div>
    <div class="scan" id="cam"><p style="color:#fff;padding:16px">Abriendo cámara…</p></div>
    <div id="result"></div>
    <button class="btn" id="photo">Tomar foto del QR</button>
    <details class="card"><summary><b>Ingresar código manual</b></summary>
      <div class="stack" style="margin-top:12px"><select id="mId" class="btn" style="text-align:left"></select>
      <input type="text" id="mCode" inputmode="numeric" placeholder="Código de 6 dígitos" autocomplete="off">
      <button class="btn primary" id="mGo">Validar código</button></div></details>`);
  $app.replaceChildren(frag); bindGo($app);
  const sel = document.getElementById('mId');
  allStudents().forEach(s => sel.append(new Option(s.name, s.id)));
  const result = document.getElementById('result');
  let t0 = performance.now(), live = null, busy = false;
  async function show(text, mode) {
    if (busy) return; busy = true;
    const r = await verifyPayload(text), ms = Math.round(performance.now() - t0);
    logEvent({ mode, id: r.student?.id || '', name: r.student?.name || '', result: r.ok ? 'Aceptado' : 'Rechazado', reason: r.ok ? '' : r.reason, ms });
    result.replaceChildren(h(verdictHtml(r, mode) + '<button class="btn primary" id="next" style="width:100%;margin-top:12px">Siguiente persona</button>'));
    navigator.vibrate?.(r.ok ? 80 : [60, 60, 60]);
    document.getElementById('next').onclick = () => { result.replaceChildren(); t0 = performance.now(); busy = false; live?.resume(); window.scrollTo(0, 0) };
    result.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  document.getElementById('photo').onclick = async () => {
    t0 = performance.now(); const f = await pickImage('environment'); if (!f) return;
    const t = await decodeFile(f); t ? show(t, 'Foto del QR') : toast('No se encontró un QR en la foto');
  };
  document.getElementById('mGo').onclick = async () => {
    const code = document.getElementById('mCode').value.replace(/\D/g, '');
    if (code.length !== DIGITS) { toast('El código tiene 6 dígitos'); return }
    // the typed code may belong to the previous window
    const s = findStudent(sel.value), n = nowStep();
    let step = n;
    if (s && code !== await hotp(s.secret, n) && code === await hotp(s.secret, n - 1)) step = n - 1;
    show(`PS1|${sel.value}|${step}|${code}`, 'Código manual');
    document.getElementById('mCode').value = '';
  };
  const cam = document.getElementById('cam');
  live = await startLiveScan(cam, t => show(t, 'Cámara'));
  if (live) cleanup.push(() => live.stop());
  else cam.replaceChildren(h('<p style="color:#fff;padding:16px">La cámara en vivo no está disponible en esta vista. Usa “Tomar foto del QR” o el código manual.</p>'));
  t0 = performance.now();
}
function viewGuardName() {
  guardShell('nombre');
  const frag = h(`${topBar(true)}
    <div class="stack"><h1>Buscar por nombre</h1><p class="muted">Respaldo para quien no trae celular. Confirma con la foto.</p></div>
    <input type="search" id="q" placeholder="Escribe el nombre" autocomplete="off">
    <div class="stack" id="res"></div>`);
  $app.replaceChildren(frag); bindGo($app);
  const t0 = performance.now(), q = document.getElementById('q'), res = document.getElementById('res');
  function render() {
    const term = q.value.trim().toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '');
    res.replaceChildren();
    allStudents().filter(s => s.name.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu, '').includes(term)).forEach(s => {
      const b = h(`<button class="btn row" style="text-align:left"><img class="avatar" alt="" src="${s.photo}"><span class="grow">${esc(s.name)}</span><span class="pill ${s.active ? 'ok' : 'bad'}">${s.active ? 'VIGENTE' : 'NO VIGENTE'}</span></button>`).firstChild;
      b.onclick = () => confirmManual(s, t0); res.append(b);
    });
  }
  q.oninput = render; render();
}
function confirmManual(s, t0) {
  const frag = h(`${topBar(true)}
    <div class="verdict ${s.active ? 'ok' : 'bad'}"><img class="avatar lg" alt="Foto del estudiante" src="${s.photo}"><div class="name">${esc(s.name)}</div>
    <span class="pill ${s.active ? 'ok' : 'bad'}">${s.active ? 'VIGENTE' : 'NO VIGENTE'}</span><p>¿La foto coincide con la persona?</p></div>
    <button class="btn primary" id="yes" ${s.active ? '' : 'disabled'}>Sí, permitir ingreso</button>
    <button class="btn danger" id="no">No coincide</button>`);
  $app.replaceChildren(frag); bindGo($app);
  const done = ok => {
    logEvent({ mode: 'Por nombre', id: s.id, name: s.name, result: ok ? 'Aceptado' : 'Rechazado', reason: ok ? '' : 'Foto no coincide', ms: Math.round(performance.now() - t0) });
    toast(ok ? 'Ingreso registrado' : 'Ingreso rechazado'); go('guardia', 'nombre');
  };
  document.getElementById('yes').onclick = () => done(true);
  document.getElementById('no').onclick = () => done(false);
}
function viewGuardStudents() {
  guardShell('estudiantes');
  const frag = h(`${topBar(true)}
    <div class="stack"><h1>Estudiantes</h1><p class="muted">Registra a un estudiante de prueba con su foto y vincula su celular.</p></div>
    <div class="card"><h2>Nuevo estudiante</h2>
      <input type="text" id="nName" placeholder="Nombre y apellido" autocomplete="off">
      <div class="row"><img class="avatar" id="nPrev" alt="" hidden><button class="btn grow" id="nPhoto">Tomar foto</button></div>
      <button class="btn primary" id="nSave">Registrar y mostrar QR de vinculación</button></div>
    <div id="pair"></div>
    <div class="stack" id="list"></div>
    <button class="btn danger" id="reset">Borrar datos de prueba de este celular</button>
    <div id="confirmReset"></div>`);
  $app.replaceChildren(frag); bindGo($app);
  let photo = null;
  document.getElementById('nPhoto').onclick = async () => {
    const f = await pickImage('user'); if (!f) return;
    const img = await loadImage(f), c = document.createElement('canvas'), side = Math.min(img.width, img.height);
    c.width = c.height = 240;
    c.getContext('2d').drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 240, 240);
    photo = c.toDataURL('image/jpeg', 0.75);
    const p = document.getElementById('nPrev'); p.src = photo; p.hidden = false;
  };
  document.getElementById('nSave').onclick = () => {
    const name = document.getElementById('nName').value.trim();
    if (name.length < 3) { toast('Escribe el nombre'); return }
    if (!photo) { toast('Toma la foto del estudiante'); return }
    const s = { id: 'E' + Date.now().toString(36).toUpperCase(), name, active: true, secret: randomSecret(), photo };
    const list = store.get('enrolled', []); list.push(s); store.set('enrolled', list);
    showPair(s); renderList();
    document.getElementById('nName').value = ''; photo = null; document.getElementById('nPrev').hidden = true;
  };
  function showPair(s) {
    const box = document.getElementById('pair');
    box.replaceChildren(h(`<div class="card cred"><h2>Vincular a ${esc(s.name)}</h2><p class="muted">El estudiante abre “Soy estudiante → Vincular credencial nueva” y escanea este QR.</p><div class="qrbox"><canvas id="pq"></canvas></div><button class="btn" id="pClose">Listo</button></div>`));
    drawQR(document.getElementById('pq'), `PSPAIR|${s.id}|${s.name}|${s.secret}`);
    document.getElementById('pClose').onclick = () => box.replaceChildren();
    box.scrollIntoView({ behavior: 'smooth' });
  }
  function renderList() {
    const box = document.getElementById('list'); box.replaceChildren();
    allStudents().forEach(s => {
      const row = h(`<div class="card row"><img class="avatar" alt="" src="${s.photo}"><div class="grow"><b>${esc(s.name)}</b><div class="note">${s.demo ? 'Ejemplo' : 'Registrado en este celular'}</div></div>
        <button class="btn" data-act="toggle">${s.active ? 'Vigente' : 'No vigente'}</button>${s.demo ? '' : '<button class="btn" data-act="pair">QR</button>'}</div>`).firstChild;
      row.querySelector('[data-act=toggle]').onclick = () => { const o = store.get('active', {}); o[s.id] = !s.active; store.set('active', o); renderList() };
      row.querySelector('[data-act=pair]')?.addEventListener('click', () => showPair(s));
      box.append(row);
    });
  }
  renderList();
  document.getElementById('reset').onclick = () => {
    const c = document.getElementById('confirmReset');
    c.replaceChildren(h(`<div class="card"><p>Se borran los estudiantes registrados, el registro de validaciones y los códigos usados de este celular.</p><div class="row"><button class="btn danger grow" id="rYes">Borrar</button><button class="btn grow" id="rNo">Cancelar</button></div></div>`));
    document.getElementById('rYes').onclick = () => { ['enrolled', 'active', 'used', 'log'].forEach(k => store.set(k, k === 'enrolled' || k === 'log' ? [] : {})); toast('Datos borrados'); viewGuardStudents() };
    document.getElementById('rNo').onclick = () => c.replaceChildren();
  };
}
function viewGuardLog() {
  guardShell('registro');
  const log = store.get('log', []);
  const ok = log.filter(e => e.result === 'Aceptado'), bad = log.filter(e => e.result !== 'Aceptado');
  const camOk = ok.filter(e => e.mode === 'Cámara');
  const avg = camOk.length ? (camOk.reduce((a, e) => a + e.ms, 0) / camOk.length / 1000).toFixed(1) + ' s' : '—';
  const reasons = {}; bad.forEach(e => reasons[e.reason] = (reasons[e.reason] || 0) + 1);
  const frag = h(`${topBar(true)}
    <div class="stack"><h1>Registro del testeo</h1><p class="muted">Cada validación queda anotada en este celular.</p></div>
    <div class="stats"><div class="stat"><span class="label">Total</span><b>${log.length}</b></div><div class="stat"><span class="label">Aceptados</span><b>${ok.length}</b></div><div class="stat"><span class="label">Rechazados</span><b>${bad.length}</b></div></div>
    <div class="card"><div class="row"><span class="grow">Tiempo promedio con cámara (aceptados)</span><b>${avg}</b></div>
    ${Object.entries(reasons).map(([r, n]) => `<div class="row"><span class="grow muted">${esc(r)}</span><b>${n}</b></div>`).join('')}</div>
    <div class="tablewrap"><table><thead><tr><th>Hora</th><th>Modo</th><th>Estudiante</th><th>Resultado</th><th>Motivo</th><th>ms</th></tr></thead><tbody>
    ${log.slice().reverse().map(e => `<tr><td>${new Date(e.t).toLocaleTimeString('es-CL')}</td><td>${esc(e.mode)}</td><td>${esc(e.name)}</td><td>${esc(e.result)}</td><td>${esc(e.reason)}</td><td>${e.ms}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Aún no hay validaciones.</td></tr>'}
    </tbody></table></div>
    <div class="row"><button class="btn grow" id="copy">Copiar CSV</button><button class="btn primary grow" id="dl">Descargar CSV</button></div>`);
  $app.replaceChildren(frag); bindGo($app);
  const csv = () => 'fecha_hora,version,modo,id,estudiante,resultado,motivo,ms\n' + log.map(e => [e.t, e.v, e.mode, e.id, e.name, e.result, e.reason, e.ms].map(x => `"${String(x).replace(/"/g, '""')}"`).join(',')).join('\n');
  document.getElementById('copy').onclick = () => navigator.clipboard.writeText(csv()).then(() => toast('CSV copiado'), () => toast('No se pudo copiar'));
  document.getElementById('dl').onclick = () => saveCsv(`registro_pasoseguro_${APP_VERSION}.csv`, csv());
}

// ---------- router ----------
function go(role, tab) {
  teardown();
  const hash = role ? (role === 'guardia' && tab && tab !== 'escanear' ? tab : role) : '';
  if (location.hash.slice(1) !== hash) { history.replaceState(null, '', hash ? '#' + hash : location.pathname); }
  render();
}
function render() {
  const r = location.hash.slice(1);
  if (r === 'estudiante') { const me = store.get('me', null); return me ? viewStudentCred(me) : viewStudentPick() }
  if (r === 'guardia') return viewGuardScan();
  if (r === 'nombre') return viewGuardName();
  if (r === 'estudiantes') return viewGuardStudents();
  if (r === 'registro') return viewGuardLog();
  viewHome();
}
window.addEventListener('hashchange', () => { teardown(); render() });
render();
</script>
